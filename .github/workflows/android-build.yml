name: Build Android APK (CBMCalculatorAirCargo)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          validate-wrappers: false

      - name: Prepare Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          gradle wrapper --gradle-version 8.4 --distribution-type bin || true
          chmod +x gradlew || true

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "
24333f8a63b6825ea9c5514f83c2829b004d1fee
d56f5187479451eabf01fb78af6dfcb131a6481e
84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo -e "
84831b9409646a918e30573bab4c9c91346d8abd
504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          echo -e "
d975f751698a77b662f1254ddbeed3901e976f5a" > "$ANDROID_HOME/licenses/intel-android-extra-license" || true
          echo -e "
e9acab5b5fbb560a72cfa4ac3ac941db4f16a988" > "$ANDROID_HOME/licenses/mips-android-sysimage-license" || true
          echo -e "
33b6a2b64607f11b759f320ef9dff4ae5c47d97a
601085b94cd77f0b54ff864063f457bd880053d0" > "$ANDROID_HOME/licenses/google-gdk-license" || true
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          fi

      - name: Compile & Assemble Android Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBMCalculatorAirCargo-v1.0.0-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Log Build Information
        run: |
          echo "============================================"
          echo "✅ Android APK successfully compiled!"
          echo "App Name: CBM Calculator · Air & Cargo"
          echo "Package ID: io.github.cbmcalculatorai"
          echo "Target Version: 1.0.0 (1)"
          echo "============================================"
