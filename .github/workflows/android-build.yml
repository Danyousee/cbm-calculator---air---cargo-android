name: Build Android APK (CBMCalculatorAirCargo)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          validate-wrappers: false

      - name: Prepare Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Fetching official gradle-wrapper.jar..."
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" ||             gradle wrapper --gradle-version 8.4 --distribution-type bin || true
          fi
          chmod +x gradlew || true

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Compile & Assemble Android Debug APK
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBMCalculatorAirCargo-v1.0.0-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Log Build Information
        run: |
          echo "============================================"
          echo "✅ Android APK successfully compiled!"
          echo "App Name: CBM Calculator · Air & Cargo"
          echo "Package ID: io.github.cbmcalculatorai"
          echo "Target Version: 1.0.0 (1)"
          echo "============================================"
