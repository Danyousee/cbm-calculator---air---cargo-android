name: Build Android APK (CBMCalculatorAirCargo)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses
        run: |
          yes | ($ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || sdkmanager --licenses || true)

      - name: Compile & Assemble Android Debug APK
        run: |
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBMCalculatorAirCargo-v1.0.0-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Log Build Information
        run: |
          echo "============================================"
          echo "✅ Android APK successfully compiled!"
          echo "App Name: CBM Calculator · Air & Cargo"
          echo "Package ID: io.github.cbmcalculav12"
          echo "Target Version: 1.0.0 (1)"
          echo "============================================"
